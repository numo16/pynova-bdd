[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pytest-nova-bdd"
version = "0.1.0.dev0"
description = "Run pytest-bdd Gherkin steps in a real browser with Amazon Nova Act."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["pytest", "pytest-bdd", "bdd", "gherkin", "nova-act", "browser-testing", "e2e"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: BDD",
    "Typing :: Typed",
]
dependencies = [
    "pytest>=7.4",
    "pytest-bdd>=8.1,<10",
    "nova-act>=3,<4",
]

[project.urls]
Homepage = "https://github.com/numo16/pynova-bdd"
Issues = "https://github.com/numo16/pynova-bdd/issues"

# Two entry points so the catch-all steps live in their own plugin module and
# register before any conftest (see docs/DESIGN.md §4.2).
[project.entry-points.pytest11]
nova_bdd = "pynova_bdd.plugin"
nova_bdd_steps = "pynova_bdd.steps"

[dependency-groups]
dev = [
    "pytest-xdist>=3.5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pynova_bdd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "pytester", "--strict-markers"]
markers = ["e2e: talks to the real Nova Act service (needs credentials)"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["nova_act.*"]
follow_untyped_imports = true
